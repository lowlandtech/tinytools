name: Build, Test & Publish

# The Gitea mirror builds the same suite and publishes to the Gitea NuGet feed only. It used
# to stamp a CalVer package version derived from the run number, which published a second
# version of the same assembly alongside the one Directory.Build.props declares. The version
# now comes from the single authority, so the feed carries one version per release.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # One pinned SDK builds netstandard2.1, net8.0, net9.0 and net10.0.
          dotnet-version: 10.0.x

      - name: Build the library for every shipped framework
        run: dotnet build src/lib/LowlandTech.TinyTools.csproj --configuration Release

      - name: Build the behavior tests
        run: dotnet build src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release --framework net10.0 -p:HostSpecs=false

      - name: Test
        run: >
          dotnet test src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release
          --framework net10.0 -p:HostSpecs=false --no-build --verbosity normal
          --filter "FullyQualifiedName!~SPEC3309&FullyQualifiedName!~SPEC3327"

  publish:
    name: Pack & Publish to Gitea NuGet
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Report the declared version
        id: ver
        run: |
          VERSION=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version from Directory.Build.props: $VERSION"

      - name: Build
        run: dotnet build src/lib/LowlandTech.TinyTools.csproj --configuration Release

      - name: Pack
        run: |
          dotnet pack src/lib/LowlandTech.TinyTools.csproj \
            --configuration Release --no-build \
            --output ./artifacts

      - name: Confirm the packed version
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          test -f "artifacts/LowlandTech.TinyTools.$VERSION.nupkg" || {
            echo "::error::Expected artifacts/LowlandTech.TinyTools.$VERSION.nupkg."
            ls -1 artifacts
            exit 1
          }

      - name: Publish to Gitea NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://git.lowlandtech.com/api/packages/tinytools/nuget/index.json \
            --api-key "${{ secrets.NUGET_TOKEN }}" \
            --skip-duplicate
