<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyTools playground</title>
    <link rel="icon" href="data:," />
    <base href="/playground/" />
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #1f2933; }
        h1 { font-size: 1.6rem; }
        .lead { color: #52606d; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { display: flex; flex-direction: column; font-weight: 600; font-size: .85rem; }
        textarea { font-family: ui-monospace, monospace; min-height: 9rem; margin-top: .35rem; padding: .5rem; }
        button { margin: 1rem 0; padding: .5rem 1.25rem; font-weight: 600; cursor: pointer; }
        pre { background: #f5f7fa; border: 1px solid #e4e7eb; padding: .75rem; overflow-x: auto; }
        .snippet block, .snippet > pre { margin-bottom: .25rem; }
        .snippet > div { display: flex; align-items: flex-start; gap: .5rem; }
        .snippet pre { flex: 1 1 auto; margin: 0; }
        .snippet button { margin: .25rem 0 0; padding: .35rem .75rem; font-size: .8rem; }
        .diagnostic { color: #b91c1c; font-weight: 600; }
        .copy-status { color: #0b7285; font-size: .85rem; }
        .version { color: #7b8794; font-size: .8rem; }
    </style>
</head>
<body>
    <div id="app">
        <p>Loading the WebAssembly engine…</p>
    </div>

    <div id="blazor-error-ui" style="display:none">
        The playground failed to start. Check the browser console for details.
    </div>

    <script>
        // The page has to work when the Clipboard API is unavailable (an insecure
        // origin, or a browser that refuses the permission), so it falls back to a
        // hidden textarea and the legacy copy command.
        window.tinytoolsCopy = async function (text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (error) {
                // fall through to the legacy path
            }
            try {
                const area = document.createElement('textarea');
                area.value = text;
                area.setAttribute('readonly', '');
                area.style.position = 'fixed';
                area.style.top = '-1000px';
                document.body.appendChild(area);
                area.select();
                const copied = document.execCommand('copy');
                document.body.removeChild(area);
                return copied;
            } catch (error) {
                return false;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
