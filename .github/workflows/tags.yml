name: Release

# The only workflow that publishes to nuget.org and GitHub Packages. CI (main.yml) verifies
# and packs, but never pushes, so a version reaches a feed from exactly one place.
#
# Feeds and secrets, for whoever runs a release:
#   nuget.org                              -> secret NUGET_API_KEY
#   nuget.pkg.github.com/lowlandtech       -> secret GITHUB_TOKEN (automatic)
#   git.lowlandtech.com/.../tinytools/nuget-> secret NUGET_TOKEN, published by .gitea/workflows/build.yml
# The release path used to read NUGET_APIKEY while an unreachable job in main.yml read
# NUGET_API_KEY, so one of the two always failed; the name is NUGET_API_KEY everywhere now.

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        # One pinned SDK builds every shipped framework; see main.yml for the same decision.
        dotnet-version: |
          10.0.x
    
    - name: Install ImageMagick
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
    
    - name: Convert icon SVG to PNG
      run: |
        if [ -f "icon.svg" ] && [ ! -f "icon.png" ]; then
          convert -background none -resize 128x128 icon.svg icon.png
          echo "Icon converted from SVG to PNG"
        else
          echo "Icon PNG already exists or SVG not found"
        fi
    
    - name: Extract version from tag
      id: get_version
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

    - name: Verify the tag matches the declared version
      run: |
        # Directory.Build.props owns the version. A tag that disagrees with it would publish
        # a package whose version does not match its own release tag.
        DECLARED=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
        TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
        echo "declared=$DECLARED tag=$TAG_VERSION"
        if [ "$DECLARED" != "$TAG_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match the declared version $DECLARED. Run eng/set-version.ps1 or retag."
          exit 1
        fi

    - name: Build the library for every shipped framework
      run: dotnet build src/lib/LowlandTech.TinyTools.csproj --configuration Release

    - name: Build the behavior tests
      run: dotnet build src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release --framework net10.0 -p:HostSpecs=false

    - name: Run the behavior tests
      run: >
        dotnet test src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release
        --framework net10.0 -p:HostSpecs=false --no-build --verbosity normal
        --filter "FullyQualifiedName!~SPEC3309&FullyQualifiedName!~SPEC3327"
    
    - name: Pack NuGet package
      run: dotnet pack src/lib/LowlandTech.TinyTools.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      if: success()
    
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/lowlandtech/index.json" --skip-duplicate
      continue-on-error: true
