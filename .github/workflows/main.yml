name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # Gates that can run without the workspace package feed. These must stay green: they
  # verify the single version authority, the behavior-test layout grammar and that the
  # library packs with the declared version on every supported target framework.
  verifiable-gates:
    name: Verifiable gates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify one version authority
      run: |
        # Directory.Build.props must be the only declaration; every project derives from it.
        DECLARED=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
        for PROJECT in src/lib/LowlandTech.TinyTools.csproj src/core/LowlandTech.TinyTools.Core.csproj src/frontend/LowlandTech.TinyTools.Frontend.csproj; do
          RESOLVED=$(dotnet msbuild "$PROJECT" -getProperty:Version -nologo)
          echo "$PROJECT -> $RESOLVED"
          if [ "$RESOLVED" != "$DECLARED" ]; then
            echo "::error::$PROJECT resolves $RESOLVED but the authority declares $DECLARED."
            exit 1
          fi
        done
        grep -q "badge/version-$DECLARED-blue" readme.md || { echo "::error::readme badge does not show $DECLARED."; exit 1; }
        grep -q "^# $DECLARED" changelog.md || { echo "::error::changelog.md has no '# $DECLARED' heading."; exit 1; }
        echo "version=$DECLARED"

    - name: Verify behavior-test layout
      run: |
        # The grammar checker is shared workspace tooling, not part of this repository. When it
        # is absent from the checkout, say so rather than reporting a pass that never ran.
        CHECKER="$GITHUB_WORKSPACE/eng/verify-test-layout.py"
        if [ ! -f "$CHECKER" ]; then
          echo "::warning::Shared layout checker not present in this checkout; the lane records its result in the workitem evidence."
          exit 0
        fi
        python3 "$CHECKER" --root src/test --json > layout.json
        python3 -c "import json,sys; data=json.load(open('layout.json')); v=data.get('violations', []); print('violations=%d' % len(v)); [print('  %s:%s %s: %s' % (i.get('file'), i.get('line'), i.get('code'), i.get('detail'))) for i in v]; sys.exit(1 if v else 0)"

    - name: Pack the library with the declared version
      run: dotnet pack src/lib/LowlandTech.TinyTools.csproj --configuration Release --output ./artifacts

    - name: Confirm the packed version
      run: |
        DECLARED=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
        test -f "artifacts/LowlandTech.TinyTools.$DECLARED.nupkg" || {
          echo "::error::Expected artifacts/LowlandTech.TinyTools.$DECLARED.nupkg."
          ls -1 artifacts
          exit 1
        }

  # The full matrix needs LowlandTech.Components, which is produced by the Components lane and
  # is not published to nuget.org. nuget.config maps LowlandTech.* to the workspace feed
  # ../packages, which does not exist on a hosted runner, so restore fails with NU1301 for
  # src/app and src/test. Until that package is published to a reachable feed, this job is
  # expected to fail: the verifiable-gates job is the signal that must stay green.
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x', '10.0.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better source link support
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests (coverage)
      if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x'
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Run tests
      if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x') }}
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/**/coverage.cobertura.xml
        fail_ci_if_error: false
        verbose: true

  pack:
    name: Pack NuGet Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version from tag: $VERSION"
      shell: bash
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build with version
      run: dotnet build --configuration Release --no-restore
    
    - name: Pack with version
      run: dotnet pack src/lib/LowlandTech.TinyTools.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 30
    
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/lowlandtech/index.json" --skip-duplicate
      continue-on-error: true
    
    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
