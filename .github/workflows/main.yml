name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # Gates that can run without the workspace package feed. These must stay green: they
  # verify the single version authority, the behavior-test layout grammar and that the
  # library packs with the declared version on every supported target framework.
  verifiable-gates:
    name: Verifiable gates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify one version authority
      run: |
        # Directory.Build.props must be the only declaration; every project derives from it.
        DECLARED=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
        for PROJECT in src/lib/LowlandTech.TinyTools.csproj src/core/LowlandTech.TinyTools.Core.csproj src/frontend/LowlandTech.TinyTools.Frontend.csproj; do
          RESOLVED=$(dotnet msbuild "$PROJECT" -getProperty:Version -nologo)
          echo "$PROJECT -> $RESOLVED"
          if [ "$RESOLVED" != "$DECLARED" ]; then
            echo "::error::$PROJECT resolves $RESOLVED but the authority declares $DECLARED."
            exit 1
          fi
        done
        grep -q "badge/version-$DECLARED-blue" readme.md || { echo "::error::readme badge does not show $DECLARED."; exit 1; }
        grep -q "^# $DECLARED" changelog.md || { echo "::error::changelog.md has no '# $DECLARED' heading."; exit 1; }
        echo "version=$DECLARED"

    - name: Verify behavior-test layout
      run: |
        # Both gates are vendored under eng/ with provenance, so CI enforces exactly what the
        # lane quotes in its evidence. No warn-and-skip path remains.
        python3 eng/verify-test-layout.py --root src/test --json > layout.json
        python3 -c "import json,sys; data=json.load(open('layout.json')); v=data.get('violations', []); print('violations=%d' % len(v)); [print('  %s:%s %s: %s' % (i.get('file'), i.get('line'), i.get('code'), i.get('detail'))) for i in v]; sys.exit(1 if v else 0)"

    - name: Verify the roadmap contract
      run: python3 eng/validate_roadmap.py --repository-root .

    - name: Pack the library with the declared version
      run: dotnet pack src/lib/LowlandTech.TinyTools.csproj --configuration Release --output ./artifacts

    - name: Confirm the packed version
      run: |
        DECLARED=$(dotnet msbuild src/lib/LowlandTech.TinyTools.csproj -getProperty:Version -nologo)
        test -f "artifacts/LowlandTech.TinyTools.$DECLARED.nupkg" || {
          echo "::error::Expected artifacts/LowlandTech.TinyTools.$DECLARED.nupkg."
          ls -1 artifacts
          exit 1
        }

  # One pinned SDK builds every framework the packages ship: 10.0.x compiles netstandard2.1,
  # net8.0, net9.0 and net10.0 from the reference packs it carries. No job installs an SDK
  # that cannot build the target it is asked for.
  #
  # The page scenarios need the App host, and the App host consumes LowlandTech.Components
  # from the workspace feed, which a hosted runner cannot restore. `HostPageSpecs=false`
  # drops that one edge and compiles the remaining 1037 specs, so the matrix runs the
  # behavior suite instead of failing at restore and running nothing. The excluded specs are
  # recorded in the workitem that owns this gate.
  #
  # SPEC3309 spawns CLI processes and SPEC3327 drives MSBuild, and both are exercised locally
  # rather than on shared runners; the filter that skips them is deliberately visible here.
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better source link support

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build every shipped target framework
      run: dotnet build src/lib/LowlandTech.TinyTools.csproj --configuration Release

    - name: Build the behavior tests
      run: dotnet build src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release --framework net10.0 -p:HostPageSpecs=false

    - name: Run the behavior tests with coverage
      if: matrix.os == 'ubuntu-latest'
      run: >
        dotnet test src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release
        --framework net10.0 -p:HostPageSpecs=false --no-build --verbosity normal
        --collect:"XPlat Code Coverage" --results-directory ./coverage
        --filter "FullyQualifiedName!~SPEC3309&FullyQualifiedName!~SPEC3327"

    - name: Run the behavior tests
      if: matrix.os != 'ubuntu-latest'
      run: >
        dotnet test src/test/LowlandTech.TinyTools.Tests.csproj --configuration Release
        --framework net10.0 -p:HostPageSpecs=false --no-build --verbosity normal
        --filter "FullyQualifiedName!~SPEC3309&FullyQualifiedName!~SPEC3327"

    - name: Enforce the coverage floor
      if: matrix.os == 'ubuntu-latest'
      run: python3 eng/check-coverage.py ./coverage --minimum 70
